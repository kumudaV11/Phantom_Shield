<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 24 24%27%3E%3Cpath d=%27M12 2 4 5v6c0 5 3.4 9.3 8 11 4.6-1.7 8-6 8-11V5l-8-3Z%27 fill=%27%2322d3ee%27/%3E%3C/svg%3E">
  <title>PHANTOM SHIELD — Intelligent Email Threat Analysis</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/scanner.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/automata.css') }}">
</head>
<body>
<!-- SVG icon sprite (custom icons, no external library) -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-logo" viewBox="0 0 24 24"><path d="M12 2 4 5v6c0 5 3.4 9.3 8 11 4.6-1.7 8-6 8-11V5l-8-3Z" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="12" cy="11" r="2.4" fill="currentColor"/></symbol>
    <symbol id="i-overview" viewBox="0 0 24 24"><path d="M4 4h7v7H4zM13 4h7v4h-7zM13 10h7v10h-7zM4 13h7v7H4z" fill="none" stroke="currentColor" stroke-width="1.6"/></symbol>
    <symbol id="i-scanner" viewBox="0 0 24 24"><path d="M3 7V4h3M18 4h3v3M21 17v3h-3M6 20H3v-3M4 12h16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></symbol>
    <symbol id="i-nfa" viewBox="0 0 24 24"><circle cx="5" cy="12" r="2.5" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="19" cy="6" r="2.5" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="19" cy="18" r="2.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M7.3 11 16.7 7M7.3 13l9.4 4" stroke="currentColor" stroke-width="1.6" fill="none"/></symbol>
    <symbol id="i-dfa" viewBox="0 0 24 24"><circle cx="5" cy="12" r="2.5" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="12" cy="12" r="2.5" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="19" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="19" cy="12" r="1.2" fill="currentColor"/><path d="M7.5 12h2M14.5 12h1.5" stroke="currentColor" stroke-width="1.6"/></symbol>
    <symbol id="i-subset" viewBox="0 0 24 24"><path d="M4 6h10M4 12h16M4 18h10M17 4l3 2-3 2M17 16l3 2-3 2" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></symbol>
    <symbol id="i-table" viewBox="0 0 24 24"><path d="M3 5h18v14H3zM3 10h18M9 5v14" fill="none" stroke="currentColor" stroke-width="1.6"/></symbol>
    <symbol id="i-perf" viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-8M22 20H2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
    <symbol id="i-data" viewBox="0 0 24 24"><ellipse cx="12" cy="6" rx="8" ry="3" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3" fill="none" stroke="currentColor" stroke-width="1.6"/></symbol>
    <symbol id="i-about" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M12 11v6M12 7.5v.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
    <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
  </defs>
</svg>

<a class="skip-link" href="#main">Skip to content</a>
<div class="shell" id="shell">
  <aside class="sidebar" id="sidebar" aria-label="Main navigation">
    <div class="brand">
      <svg class="icon brand-icon"><use href="#i-logo"/></svg>
      <div class="brand-text"><strong>PHANTOM SHIELD</strong><span>Intelligent Email Threat Analysis</span></div>
    </div>
    <nav>
      <a href="#overview" data-nav="overview"><svg class="icon"><use href="#i-overview"/></svg><span>Overview</span></a>
      <a href="#scanner" data-nav="scanner"><svg class="icon"><use href="#i-scanner"/></svg><span>Email Scanner</span></a>
      <a href="#nfa" data-nav="nfa"><svg class="icon"><use href="#i-nfa"/></svg><span>NFA Explorer</span></a>
      <a href="#dfa" data-nav="dfa"><svg class="icon"><use href="#i-dfa"/></svg><span>DFA Explorer</span></a>
      <a href="#subset" data-nav="subset"><svg class="icon"><use href="#i-subset"/></svg><span>Subset Construction</span></a>
      <a href="#table" data-nav="table"><svg class="icon"><use href="#i-table"/></svg><span>DFA Transition Table</span></a>
      <a href="#perf" data-nav="perf"><svg class="icon"><use href="#i-perf"/></svg><span>Performance Lab</span></a>
      <a href="#dataset" data-nav="dataset"><svg class="icon"><use href="#i-data"/></svg><span>Dataset</span></a>
      <a href="#about" data-nav="about"><svg class="icon"><use href="#i-about"/></svg><span>About Project</span></a>
    </nav>
  </aside>

  <div class="main-col">
    <header class="topbar">
      <button class="icon-btn" id="sidebar-toggle" aria-label="Collapse or expand sidebar" aria-expanded="true"><svg class="icon"><use href="#i-menu"/></svg></button>
      <div class="topbar-title"><span class="topbar-brand">PHANTOM SHIELD</span><span class="sep">/</span><span id="page-title">Overview</span></div>
      <div class="engine-status" id="engine-status" role="status"><span class="dot"></span><span id="engine-text">Connecting…</span></div>
    </header>
    <main id="main" tabindex="-1">
      {% block content %}{% endblock %}
    </main>
  </div>
</div>
<div id="toasts" class="toasts" aria-live="polite"></div>

<script src="{{ url_for('static', filename='js/app.js') }}"></script>
<script src="{{ url_for('static', filename='js/graph_view.js') }}"></script>
<script src="{{ url_for('static', filename='js/scanner.js') }}"></script>
<script src="{{ url_for('static', filename='js/nfa_visualizer.js') }}"></script>
<script src="{{ url_for('static', filename='js/dfa_visualizer.js') }}"></script>
<script src="{{ url_for('static', filename='js/subset_construction.js') }}"></script>
<script src="{{ url_for('static', filename='js/benchmark.js') }}"></script>
<script src="{{ url_for('static', filename='js/pages.js') }}"></script>
<script>PS.start();</script>
</body>
</html>
